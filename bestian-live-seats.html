  var names=['김베스','이티안','박하안','정광명','최소하','한지원','오서준','윤다은','장민재','서예린','강하늘','임도현'],td=bizToday(),base=bizDate();RK.users={};RK.rows=[];
  names.forEach(function(n,i){RK.users['u'+i]=n;for(var k=0;k<12;k++){var d=new Date(base);d.setDate(d.getDate()-k);var ds=fmtD(d);if(((i*7+k*3)%5)===0)continue;
    var inH=9+((i+k)%3),outH=Math.min(23,inH+7+((i*5+k)%6)),row={student_id:'u'+i,attend_date:ds,check_in_time:pad(inH)+':00:00',out_1_start:'12:00:00',out_1_end:'13:00:00'};
    row.check_out_time=ds===td?(i%4===3?pad(inH+5)+':00:00':null):pad(outH)+':00:00';RK.rows.push(row)}})}
async function fetchAllAtt(from){var all=[],page=0,size=1000,sel='student_id,attend_date,check_in_time,check_out_time,check_out_is_next_day,pending_out_start,out_1_start,out_1_end,out_1_end_is_next_day,out_2_start,out_2_end,out_2_end_is_next_day,extra_out_minutes';
  while(page<12){var r=await db.from('reading_room_attendance').select(sel).gte('attend_date',from).order('attend_date',{ascending:true}).order('student_id',{ascending:true}).range(page*size,page*size+size-1);
    if(r.error)throw r.error;var d=r.data||[];all=all.concat(d);if(d.length<size)break;page++}
  return all}
async function loadRank(){if(rankBusy)return;rankBusy=true;
  try{
    if(MOCK)mockRank();
    else{if(!db)throw new Error('no db');
      var from=weekStartStr()<monthStartStr()?weekStartStr():monthStartStr();RK.rows=await fetchAllAtt(from);
      var ids={};[bizToday(),weekStartStr(),monthStartStr()].forEach(function(f){rankList(f).slice(0,10).forEach(function(r){ids[r.id]=1})});
      var keys=Object.keys(ids),nm={};
      if(keys.length){var u=await db.from('users').select('id,name').in('id',keys);if(u.error)throw u.error;(u.data||[]).forEach(function(x){nm[String(x.id)]=x.name})}
      RK.users=nm}
    $('#rmsg').textContent='';renderRank();
  }catch(e){$('#rmsg').textContent='순위를 불러오지 못했어요. 잠시 후 다시 시도해요.'}
  finally{rankBusy=false}}
function setView(v){VIEW=v;$('#vSeat').hidden=v!=='seat';$('#vRank').hidden=v!=='rank';
  $$('#vseg button').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-v')===v?'true':'false')});
  try{history.replaceState(null,'',v==='rank'?'#rank':location.pathname+location.search)}catch(e){}
  if(v==='rank'){rtabs();loadRank()}}
$('#vseg').addEventListener('click',function(e){var b=e.target.closest('[data-v]');if(b)setView(b.getAttribute('data-v'))});
setInterval(function(){if(VIEW==='rank'&&document.visibilityState!=='hidden')loadRank()},60000);
setInterval(function(){if(VIEW==='rank'&&RK.rows.length)renderRank()},30000);
tabs();load();setInterval(load,15000);
setView(location.hash==='#rank'?'rank':'seat');
})();
</script>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0072b5">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="logo.png">
<title>베스티안 온라인 실시간 · 좌석</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f7f9;--line:#d8dfe5;--ink:#1d2328;--mute:#6b737a;--blue:#0072b5;--blued:#004f80;--yellow:#f2c100;--green:#1f7a4d;--amber:#9a5b00;--red:#b02a37}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit}
.top{background:var(--blue);color:#fff;border-bottom:6px solid var(--yellow)}.top .in{max-width:1080px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:clamp(18px,4vw,27px);margin:0;font-weight:900;color:#fff;white-space:nowrap}.top h1 small{display:block;font-size:11.5px;letter-spacing:.14em;color:#ffe680;font-weight:700}.top img{height:38px;background:#fff;border-radius:6px;padding:5px 8px}
main{max-width:1080px;margin:0 auto;padding:18px 16px;display:grid;gap:16px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:16px}@media(max-width:820px){.g2{grid-template-columns:minmax(0,1fr)}}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}.panel h3{margin:0 0 8px;font-size:16px;font-weight:900;color:var(--blued)}
.inp,.ta,.sel{width:100%;font-size:16px;padding:10px 11px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.btn{display:inline-block;background:var(--blue);color:#fff;font-weight:900;padding:10px 14px;border-radius:8px;border:0;cursor:pointer;min-height:40px}.btn.g{background:#eef5fa;color:var(--ink)}
.hint{font-size:13px;color:var(--mute);margin:0}
.kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}@media(max-width:600px){.kpi{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}.kpi small{display:block;color:var(--mute);font-size:12px}.kpi b{font-size:22px}
table{width:100%;border-collapse:collapse;font-size:14px}th{background:var(--blued);color:#fff;padding:8px;font-weight:700}td{padding:8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}td:first-child{text-align:left;font-weight:700;color:var(--blued)}
.in{color:var(--green);font-weight:900}.out{color:var(--amber);font-weight:900}.done{color:var(--mute);font-weight:900}.none{color:var(--red);font-weight:900}
.upd{font-size:12.5px;color:var(--mute)}

body{background:#eaf4ec}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:800;color:var(--blued);cursor:pointer}.tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.hall{background:#dff0e3;border:2px solid #bfe0cc;border-radius:16px;padding:16px;min-width:0}.hall h3{margin:0 0 10px;font-size:15px;color:var(--green)}
.grid{display:grid;gap:8px;justify-content:center}
.seat{aspect-ratio:1/1;min-width:0;border-radius:10px;background:#fff;border:1.5px solid #c9e2d1;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:clamp(13px,2.6vw,18px);color:#8fa79a;position:relative}
.seat.in{background:var(--blue);border-color:var(--blued);color:#fff;box-shadow:0 3px 10px rgba(0,114,181,.3)}
.seat.out{background:var(--yellow);border-color:#d8ad00;color:#5a4300}
.seat.done{background:#f4f6f5;color:#b6c4bb}
.seat.me::after{content:"내 자리";position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;font-size:10px;padding:1px 6px;border-radius:999px;white-space:nowrap}
.gap{min-width:0}.x{display:flex;align-items:center;justify-content:center;color:#b6c4bb}.door{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mute);background:#fff;border-radius:8px;border:1px dashed #bfe0cc}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--mute)}.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px;border:1px solid #c9e2d1;background:#fff}.legend i.in{background:var(--blue);border-color:var(--blued)}.legend i.out{background:var(--yellow)}.legend i.done{background:#f4f6f5}
.kpi{grid-template-columns:repeat(3,minmax(0,1fr))}
</style>
</head>
<body>
<div class="top"><div class="in"><h1><small>BESTIAN STUDY CENTER</small>베스티안 온라인 실시간</h1><img src="logo.png" alt="BESTIAN"></div></div>
<main>
  <div class="kpi" id="kpi"></div>
  <div class="panel" style="display:grid;gap:10px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div class="tabs" id="tabs"></div><span class="upd" id="upd"></span></div>
    <div id="halls" style="display:grid;gap:14px"></div>
    <div class="legend"><span><i class="in"></i>공부 중</span><span><i class="out"></i>외출</span><span><i class="done"></i>하원</span><span><i></i>빈자리</span><span id="msg"></span></div>
  </div>
  <p class="hint" style="text-align:center">이름은 보이지 않아요. 자리 번호만 표시돼요 · 키오스크 입실·외출·하원이 바로 반영돼요 · <a href="bestian-student.html" style="color:var(--blue);font-weight:700">내 스케줄러로</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
"use strict";
var SUPABASE_URL='https://qtpftloyumtffvgurvqv.supabase.co',SUPABASE_KEY='sb_publishable_XGP9n-2fuBQFuJlAA5MJ8w_R8JYIi9O';
var MOCK=/[?&]mock=1/.test(location.search),db=null;try{if(!MOCK&&window.supabase)db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY)}catch(e){}
var $=function(s){return document.querySelector(s)},$$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))},pad=function(n){return n<10?'0'+n:''+n};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
function fmtD(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function bizToday(){var d=new Date();if(d.getHours()<1||(d.getHours()===1&&d.getMinutes()<10))d.setDate(d.getDate()-1);return fmtD(d)}
function tMin(t){if(!t)return null;var m=String(t).match(/^(\d{1,2}):(\d{2})/);return m?(+m[1])*60+(+m[2]):null}
function nowMin(){var d=new Date();var m=d.getHours()*60+d.getMinutes();if(bizToday()!==fmtD(d))m+=1440;return m}
function outs(r){var o=[];[['out_1_start','out_1_end'],['out_2_start','out_2_end']].forEach(function(p){if(r[p[0]])o.push({s:tMin(r[p[0]]),e:r[p[1]]?tMin(r[p[1]]):null})});(Array.isArray(r.extra_outs)?r.extra_outs:[]).forEach(function(x){if(x&&x.start)o.push({s:tMin(x.start),e:x.end?tMin(x.end):null})});if(r.pending_out_start)o.push({s:tMin(r.pending_out_start),e:null});return o}
function statusOf(r){if(!r||!r.check_in_time)return 'none';if(r.check_out_time)return 'done';return outs(r).some(function(o){return o.e==null})?'out':'in'}
function minutesOf(r){if(!r||!r.check_in_time)return 0;var ci=tMin(r.check_in_time),end=r.check_out_time?tMin(r.check_out_time):nowMin();var m=end-ci;outs(r).forEach(function(o){if(o.s==null)return;var e=o.e==null?nowMin():o.e;m-=Math.max(0,Math.min(e,end)-o.s)});m-=Number(r.extra_out_minutes)||0;return Math.max(0,m)}
function fmtM(m){m=Math.max(0,Math.round(m));return m>=60?Math.floor(m/60)+'시간 '+pad(m%60)+'분':m+'분'}
var ROOMS=[
 {name:"1열람실",cols:6,rows:[[16,17,18,"gap",14,15],[19,20,21,"gap",12,13],[22,23,24,"gap",11,"x"],[25,26,27,"gap",9,10],[28,29,30,"gap",7,8],[31,32,33,"gap",5,6],[34,35,36,"gap",3,4],[37,38,"x","door",2,1]]},
 {name:"2열람실",cols:6,rows:[["blank",52,53,"gap",50,51],[54,55,56,"gap",48,49],[57,58,59,"gap","blank",47],[60,61,62,"gap",45,46],[63,64,65,"gap",43,44],[66,67,68,"gap",41,42],[69,70,71,"gap",39,40],[72,73,74,75,"blank","door"]]},
 {name:"3열람실",tag:"남자",cols:7,rows:[["blank",82,83,84,85,86,87],["door",76,77,78,79,80,81]]},
 {name:"4열람실",tag:"여자",cols:7,rows:[[96,95,94,"gap",93,92,91],[97,98,99,"door",88,89,90]]}];
var SEL='all',ATT=[],SEATS=[],chan=null,ME=null;try{ME=JSON.parse(localStorage.getItem('bs_student')||'null')}catch(e){}
function tabs(){$('#tabs').innerHTML='<button class="'+(SEL==='all'?'on':'')+'" data-t="all">전체</button>'+ROOMS.map(function(r,i){return '<button class="'+(SEL===i?'on':'')+'" data-t="'+i+'">'+r.name+'</button>'}).join('')}
$('#tabs').addEventListener('click',function(e){var b=e.target.closest('[data-t]');if(!b)return;SEL=b.dataset.t==='all'?'all':+b.dataset.t;tabs();render()});
async function load(){
  try{
    if(MOCK){ATT=[{student_id:'u0',check_in_time:'09:05:00'},{student_id:'u1',check_in_time:'09:30:00',pending_out_start:'12:30:00'},{student_id:'u2',check_in_time:'08:50:00',check_out_time:'16:10:00'},{student_id:'u3',check_in_time:'10:00:00'}];SEATS=[{seat_no:16,student_id:'u0'},{seat_no:21,student_id:'u1'},{seat_no:3,student_id:'u2'},{seat_no:52,student_id:'u3'},{seat_no:77,student_id:'u9'}]}
    else{if(!db)throw new Error('no db');var a=await db.from('reading_room_attendance').select('*').eq('attend_date',bizToday());if(a.error)throw a.error;ATT=a.data||[];var s=await db.from('reading_room_seats').select('seat_no,student_id');if(s.error)throw s.error;SEATS=s.data||[]}
    $('#msg').textContent='';
  }catch(e){$('#msg').textContent='출결 서버에 연결하지 못했어요. 잠시 후 다시 시도해요.';return}
  render();var d=new Date();$('#upd').textContent='갱신 '+pad(d.getHours())+':'+pad(d.getMinutes());
  if(db&&!chan){try{chan=db.channel('bseat-live').on('postgres_changes',{event:'*',schema:'public',table:'reading_room_attendance'},function(){load()}).on('postgres_changes',{event:'*',schema:'public',table:'reading_room_seats'},function(){load()}).subscribe()}catch(e){}}}
function render(){
  var byId={};ATT.forEach(function(r){byId[r.student_id]=r});var sid={};SEATS.forEach(function(s){if(s.student_id)sid[s.seat_no]=s.student_id});
  var c={in:0,out:0,done:0};ATT.forEach(function(r){var st=statusOf(r);if(c[st]!=null)c[st]++});
  $('#kpi').innerHTML='<div><small>지금 공부 중</small><b class="in">'+c.in+'명</b></div><div><small>외출</small><b class="out">'+c.out+'명</b></div><div><small>오늘 하원</small><b class="done">'+c.done+'명</b></div>';
  var list=SEL==='all'?ROOMS:[ROOMS[SEL]];
  $('#halls').innerHTML=list.map(function(room){return '<div class="hall"><h3>'+room.name+(room.tag?' <small style="font-weight:500;color:var(--mute)">'+room.tag+'</small>':'')+'</h3><div class="grid" style="grid-template-columns:repeat('+room.cols+',minmax(0,64px))">'+room.rows.map(function(row){return row.map(function(c){
    if(c==='gap'||c==='blank')return '<div class="gap"></div>';if(c==='x')return '<div class="x">✕</div>';if(c==='door')return '<div class="door">출입구</div>';
    var id=sid[c],st=id?statusOf(byId[id]):'none';var cls=st==='in'?'in':st==='out'?'out':st==='done'?'done':'';if(ME&&id&&ME.id===id)cls+=' me';
    return '<div class="seat '+cls+'" title="'+c+'번">'+c+'</div>'}).join('')}).join('')+'</div></div>'}).join('')}
tabs();load();setInterval(load,15000);
})();
</script>
</body>
</html>

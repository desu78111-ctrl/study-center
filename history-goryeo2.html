<title>고려 탐험대 ② 무신 정권~멸망</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout concept: a comic-book reader (panel grid, speech bubbles) that hands off to a graded exam sheet. */
:root{
  --bg:#e9eef7; --fg:#1b1b2f; --muted:#5a6078; --card:#ffffff; --line:#c9d1e3;
  --acc:#e5484d; --acc-ink:#ffffff; --hl:#ffd23f; --blue:#2f6fed; --ok:#17835a; --ok-bg:#e3f6ec; --no:#c9303f; --no-bg:#fde8ea;
  --comic:#1b1b2f; --dots:rgba(47,111,237,.10);
  --f-display:'Jua','Noto Sans KR',sans-serif; --f-body:'Noto Sans KR',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12141f; --fg:#eef0f8; --muted:#a6adc8; --card:#1d2032; --line:#33384f;
  --acc:#ff6b70; --acc-ink:#1b1b2f; --hl:#ffd23f; --blue:#7aa2ff; --ok:#4ad19a; --ok-bg:#12332a; --no:#ff7a86; --no-bg:#3a1a20;
  --dots:rgba(122,162,255,.10); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141f; --fg:#eef0f8; --muted:#a6adc8; --card:#1d2032; --line:#33384f;
  --acc:#ff6b70; --acc-ink:#1b1b2f; --hl:#ffd23f; --blue:#7aa2ff; --ok:#4ad19a; --ok-bg:#12332a; --no:#ff7a86; --no-bg:#3a1a20;
  --dots:rgba(122,162,255,.10); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);background-image:radial-gradient(var(--dots) 1.5px,transparent 1.6px);background-size:14px 14px;color:var(--fg);font-family:var(--f-body);line-height:1.6;
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1000px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 14px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,5vw,38px);margin:0;letter-spacing:.01em;line-height:1.15}
h1 small{display:block;font-family:var(--f-body);font-size:13px;color:var(--muted);letter-spacing:0;margin-top:4px}
.tabs{display:flex;gap:8px}
.tabs button{font:inherit;font-family:var(--f-display);font-size:17px;padding:8px 18px;border:3px solid var(--comic);border-radius:10px;background:var(--card);color:var(--fg);cursor:pointer;box-shadow:3px 3px 0 var(--comic)}
.tabs button[aria-selected="true"]{background:var(--hl);color:var(--comic)}
button:focus-visible,input:focus-visible+label{outline:3px solid var(--blue);outline-offset:2px}

/* ---------- comic reader ---------- */
.slide{background:var(--card);border:3px solid var(--comic);border-radius:14px;box-shadow:6px 6px 0 var(--comic);padding:clamp(14px,3vw,26px)}
.shead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.chip{font-family:var(--f-display);background:var(--acc);color:var(--acc-ink);padding:2px 12px;border-radius:99px;font-size:15px;border:2px solid var(--comic)}
.shead h2{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,4vw,30px);margin:0;text-wrap:balance}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(max-width:640px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{position:relative;border:3px solid var(--comic);border-radius:6px;overflow:hidden;background:#fff;box-shadow:4px 4px 0 var(--comic);display:flex;flex-direction:column}
.panel svg{display:block;width:100%;height:auto;aspect-ratio:320/200}
.cap{background:var(--hl);color:var(--comic);font-family:var(--f-display);font-size:16px;padding:5px 10px;border-top:3px solid var(--comic)}
.bub{position:absolute;top:8px;max-width:68%;background:#fff;color:#1b1b2f;border:2.5px solid #1b1b2f;border-radius:16px;padding:6px 11px;font-family:var(--f-display);font-size:clamp(14px,2.2vw,16px);line-height:1.35;z-index:2}
.bub.l{left:8px}.bub.r{right:8px}
.bub::after{content:"";position:absolute;bottom:-11px;width:14px;height:14px;background:#fff;border-right:2.5px solid #1b1b2f;border-bottom:2.5px solid #1b1b2f;transform:rotate(45deg)}
.bub.l::after{left:22px}.bub.r::after{right:22px}
.bub.shout{background:#fff3b0;border-width:3px;border-radius:6px}
.bub b{color:#d62839;font-weight:400}
.radar{margin-top:18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px}
@media(max-width:700px){.radar{grid-template-columns:minmax(0,1fr)}}
.box{border:2.5px solid var(--comic);border-radius:10px;padding:12px 14px;background:var(--bg)}
.box h3{font-family:var(--f-display);font-weight:400;font-size:18px;margin:0 0 6px}
.box ul{margin:0;padding-left:18px}.box li{margin:2px 0;font-size:14px}
.big{font-family:var(--f-display);font-size:40px;line-height:1;color:var(--acc)}
.big small{font-size:16px;color:var(--muted);font-family:var(--f-body)}
.trap{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.trap span{font-size:13px;border:2px dashed var(--no);color:var(--no);border-radius:6px;padding:0 8px;text-decoration:line-through;text-decoration-thickness:1.5px}
.src{font-size:12.5px;color:var(--muted);margin-top:6px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px}
.nav button,.btn{font-family:var(--f-display);font-size:17px;padding:8px 20px;border:3px solid var(--comic);border-radius:10px;background:var(--card);color:var(--fg);cursor:pointer;box-shadow:3px 3px 0 var(--comic)}
.nav button:disabled{opacity:.4;cursor:default}
.btn.main{background:var(--acc);color:var(--acc-ink)}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--comic);background:var(--card);display:block}
.dots i.on{background:var(--acc)}
.timeline{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:16px}
@media(max-width:700px){.timeline{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tl{border:3px solid var(--comic);border-radius:10px;padding:10px;background:var(--bg);text-align:center}
.tl b{font-family:var(--f-display);font-weight:400;font-size:20px;display:block}
.tl .n{font-family:var(--f-display);font-size:34px;color:var(--acc);line-height:1}
.tl small{color:var(--muted);display:block;font-size:12.5px}
.tl .bar{height:10px;border:2px solid var(--comic);border-radius:99px;margin-top:6px;overflow:hidden;background:var(--card)}
.tl .bar i{display:block;height:100%;background:var(--blue)}
.dict{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:800px){.dict{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.dict{grid-template-columns:minmax(0,1fr)}}
.dict .box h3{display:flex;justify-content:space-between;gap:8px}
.dict .box h3 small{font-family:var(--f-body);font-size:12px;color:var(--muted)}
table.cmp{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
table.cmp th,table.cmp td{border:2px solid var(--comic);padding:6px 8px;text-align:left;vertical-align:top}
table.cmp th{background:var(--hl);color:var(--comic);font-family:var(--f-display);font-weight:400}
.tw{overflow-x:auto}

/* ---------- exam ---------- */
.bar-sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border:3px solid var(--comic);border-radius:12px;box-shadow:4px 4px 0 var(--comic);padding:8px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.prog{flex:1 1 160px;height:14px;border:2px solid var(--comic);border-radius:99px;overflow:hidden;background:var(--bg)}
.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s}
.bar-sticky b{font-family:var(--f-display);font-weight:400;font-size:18px;font-variant-numeric:tabular-nums}
.intro{margin-bottom:16px}
.intro p{margin:4px 0;font-size:14.5px}
.lv{font-family:var(--f-display);font-weight:400;font-size:clamp(20px,3.5vw,26px);margin:26px 0 10px;display:flex;flex-wrap:wrap;align-items:baseline;gap:10px}
.lv small{font-family:var(--f-body);font-size:13px;color:var(--muted)}
.q{background:var(--card);border:3px solid var(--comic);border-radius:12px;padding:14px 16px;margin-bottom:14px;box-shadow:4px 4px 0 var(--comic)}
.q.ok{border-color:var(--ok)}.q.ng{border-color:var(--no)}
.qh{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px}
.qn{font-family:var(--f-display);font-size:20px;background:var(--hl);color:var(--comic);border:2px solid var(--comic);border-radius:8px;padding:0 10px}
.tag{font-size:12px;border:1.5px solid var(--line);border-radius:99px;padding:0 9px;color:var(--muted)}
.mark{margin-left:auto;font-family:var(--f-display);font-size:18px}
.q.ok .mark{color:var(--ok)}.q.ng .mark{color:var(--no)}
.qt{white-space:pre-line;margin:4px 0 10px;font-weight:500}
.pass{white-space:pre-line;background:var(--bg);border-left:5px solid var(--blue);padding:8px 12px;margin:0 0 10px;font-size:14.5px;border-radius:0 8px 8px 0}
.opts{display:grid;gap:6px}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts label{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer;background:var(--card)}
.opts label:hover{border-color:var(--blue)}
.opts .no{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--comic);display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--bg)}
.opts input:checked+label{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 14%,var(--card))}
.opts input:checked+label .no{background:var(--blue);color:#fff}
.q.lock .opts label{cursor:default}
.opts label.right{border-color:var(--ok);background:var(--ok-bg)}
.opts label.wrong{border-color:var(--no);background:var(--no-bg)}
.exp{margin-top:10px;border-top:2px dashed var(--line);padding-top:8px;font-size:14.5px}
.exp b{font-family:var(--f-display);font-weight:400}
.exp .from{font-size:12.5px;color:var(--muted);margin-top:4px}
.result{background:var(--card);border:3px solid var(--comic);border-radius:14px;box-shadow:6px 6px 0 var(--comic);padding:18px;margin-bottom:20px}
.result h2{font-family:var(--f-display);font-weight:400;margin:0 0 8px;font-size:26px}
.score{display:flex;flex-wrap:wrap;gap:18px;align-items:center}
.ring{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--comic)}
.ring div{width:104px;height:104px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;border:3px solid var(--comic);font-family:var(--f-display);font-size:28px;line-height:1.05;white-space:nowrap}
.ring small{display:block;font-size:13px;font-family:var(--f-body);color:var(--muted)}
.rows{flex:1 1 260px;display:grid;gap:7px}
.row{display:grid;grid-template-columns:86px 1fr 52px;gap:8px;align-items:center;font-size:14px}
.row .t{height:12px;border:2px solid var(--comic);border-radius:99px;background:var(--bg);overflow:hidden}
.row .t i{display:block;height:100%;background:var(--ok)}
.row span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.msg{margin:12px 0 0;font-size:15px}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--comic);color:#fff;padding:10px 18px;border-radius:99px;font-family:var(--f-display);z-index:20;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.timeline.t5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:700px){.timeline.t5{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>

var cur=0,story=document.getElementById('view-story');
function renderStory(){var s=SLIDES[cur];
  var dots=SLIDES.map(function(_,i){return '<i class="'+(i===cur?'on':'')+'"></i>';}).join('');
  story.innerHTML='<article class="slide"><div class="shead"><span class="chip">'+s.chip+'</span><h2>'+s.title+'</h2></div>'+s.html()+'</article>'+
  '<div class="nav"><button id="prev"'+(cur===0?' disabled':'')+'>이전</button><div class="dots" aria-label="'+(cur+1)+' / '+SLIDES.length+'">'+dots+'</div><button id="next"'+(cur===SLIDES.length-1?' disabled':'')+'>다음</button></div>';
  document.getElementById('prev').onclick=function(){go(cur-1)};
  document.getElementById('next').onclick=function(){go(cur+1)};
  var gq=document.getElementById('go-quiz'); if(gq) gq.onclick=function(){show('quiz')};
}
function go(n){if(n<0||n>=SLIDES.length)return;cur=n;renderStory();window.scrollTo({top:0})}
document.addEventListener('keydown',function(e){if(story.hidden)return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);});

{lv:1,tag:'원 간섭기',src:'고3 2022-06 5번 변형',p:'홍문계는 딸이 공녀로 선발되자 권세가에게 부탁하여 면하려 하였으나 성사되지 못하였다. 결국 딸의 머리를 깎아 공녀가 되는 것을 막았다.',q:'이 자료의 상황이 나타난 시기의 모습으로 옳은 것은?',o:['6두품이 골품제의 한계에 반발하였다.','권문세족이 대농장을 확대하였다.','사림이 서원을 세웠다.','시전 상인이 금난전권을 행사하였다.','호족이 지방에서 독자 세력을 형성하였다.'],a:1,
 e:'공녀를 보낸 시기는 원 간섭기예요. 이때 원을 등에 업은 권문세족이 대농장을 확대했어요. 6두품·호족은 신라, 사림·금난전권은 조선의 모습이에요.'},
{lv:1,tag:'원 간섭기',src:'고1 2016-11 5번 변형',p:'다루가치, 쌍성총관부는 모두 저들 관청인데, 정동행성까지 설치하니 더욱 한탄스럽다오. 군수 물자를 강제로 요구하니 참으로 끝이 없다네.',q:'이 자료에 나타난 시기에 볼 수 있는 모습으로 옳은 것은?',o:['공녀로 끌려가는 여인','화랑도에 입문하는 청소년','태학에서 공부하는 학생','국학에서 공부하는 학생','집강소에서 활동하는 동학 농민군'],a:0,
 e:'다루가치·정동행성은 원 간섭기의 모습이에요. 이 시기에 공녀가 끌려갔어요. 화랑도와 국학은 신라, 태학은 고구려, 집강소는 동학 농민 운동과 관련돼요.'},
{lv:1,tag:'원 간섭기',src:'고1 2017-11 5번 변형',p:'충렬왕, 충선왕, 충숙왕, 충혜왕은 대대로 원의 공주에게 장가를 들고 원 황실의 사위가 되었다. 국내에 머물지 못하는 날이 많았다.',q:'이 시기의 모습으로 옳은 것은?',o:['공명첩을 구입하는 농민','권문세족이 대규모 농장을 경영하는 모습','서원에 모이는 유생','상평통보로 거래하는 상인','신해통공으로 자유 상업이 확대되는 시장'],a:1,
 e:'왕이 원의 사위가 되었던 시기는 원 간섭기예요. 이때 권문세족이 대농장을 경영했어요. 공명첩·서원·상평통보·신해통공은 조선의 모습이에요.'},
{lv:1,tag:'원 간섭기',src:'고1 2019-11 8번 · 고2 2015-11 7번 변형',p:'조서를 받들고는 온 나라가 모두 머리를 깎았다오. 요즘 관료들 사이에서 변발을 하고 몽골식 모자인 발립을 쓰는 것이 유행하고 있다.',q:'이 시기의 사회 모습으로 옳은 것은?',o:['권문세족이 대농장을 경영하였다.','6두품이 골품제에 불만을 가졌다.','사림이 향약을 보급하였다.','상민이 공명첩으로 신분을 높였다.','호족이 성주·장군을 자처하였다.'],a:0,
 e:'변발과 발립 같은 몽골풍이 유행한 시기는 원 간섭기예요. 이때 권문세족이 대농장을 경영했어요. 6두품·호족은 신라, 사림과 공명첩은 조선의 모습이에요.'},
{lv:1,tag:'공민왕',src:'고1 2018-11 4번 변형',p:'◦ 변발과 호복 같은 몽골풍을 금지하였다.\n◦ 기철 등 친원 세력을 숙청하였다.\n◦ 정동행성 이문소를 폐지하였다.',q:'이 국왕에 대한 설명으로 옳은 것은?',o:['쌍성총관부를 공격하였다.','훈요 10조를 남겼다.','과거제를 도입하였다.','노비안검법을 시행하였다.','12목을 설치하였다.'],a:0,
 e:'변발·호복 금지와 기철 숙청, 정동행성 이문소 폐지는 공민왕의 반원 개혁이에요. 쌍성총관부도 공격해 되찾았어요. 훈요 10조는 태조, 과거제·노비안검법은 광종, 12목은 성종이에요.'},
{lv:1,tag:'공민왕',src:'고3 2025-09 6번 변형',p:'쌍성의 천호인 이자춘이 와서 알현하니 왕이 그를 맞이하였다. 이자춘이 왕의 명령을 듣고 조용히 유인우와 합세한 후 쌍성총관부를 되찾았다.',q:'이 왕에 대한 설명으로 옳은 것은?',o:['삼별초를 조직하였다.','정동행성 이문소를 폐지하였다.','정방을 설치하였다.','교정도감을 설치하였다.','탕평비를 세웠다.'],a:1,
 e:'이자춘의 도움으로 쌍성총관부를 되찾은 왕은 공민왕이에요. 공민왕은 정동행성 이문소도 폐지했어요. 삼별초와 정방은 최우, 교정도감은 최충헌, 탕평비는 영조 때예요.'},
{lv:1,tag:'공민왕',src:'고2 2020-11 6번 변형',p:'이 누각은 홍건적의 침입 당시 안동으로 피난 온 왕이 자주 들렀던 영호루를 복원한 것이다. 이 왕은 기철 일파를 숙청하고 정동행성 이문소를 폐지하였다.',q:'이 왕의 정책으로 옳은 것은?',o:['전민변정도감을 설치하였다.','균역법을 실시하였다.','경국대전을 반포하였다.','탕평책을 실시하였다.','광무개혁을 추진하였다.'],a:0,
 e:'홍건적의 침입과 기철 숙청은 공민왕 때예요. 공민왕은 신돈을 등용해 전민변정도감을 설치했어요. 균역법과 탕평책은 영조, 경국대전은 성종, 광무개혁은 고종 때예요.'},
{lv:1,tag:'불교',src:'고2 2025-10 7번 변형',p:'강진 월남사지 진각국사비는 지눌의 제자 혜심을 기리기 위해 세워졌다. 혜심은 수도 개경의 국자감에서 유학을 공부하기도 하였다.',q:'이 승려에 대한 설명으로 옳은 것은?',o:['교관겸수를 내세웠다.','화쟁 사상을 주장하였다.','화엄 사상을 전하였다.','해동 천태종을 창시하였다.','지눌의 제자로 유불 일치설을 주장하였다.'],a:4,
 e:'혜심은 지눌의 제자로 유불 일치설을 주장했어요. 교관겸수와 해동 천태종은 의천, 화쟁 사상은 원효, 화엄 사상은 의상이에요.'},
{lv:1,tag:'불교',src:'고2 2019-11 7번 변형',p:'수선사 형지기는 수선사의 창건 연혁과 가람 배치, 승려 수, 재산 목록, 보조국사비명이 기록된 문서이다.',q:'이 사찰에서 활동한 보조국사에 대한 설명으로 옳은 것은?',o:['해동 천태종을 창시하였다.','현량과 실시를 건의하였다.','돈오점수를 주장하였다.','무애가를 지어 대중에게 전하였다.','왕오천축국전을 저술하였다.'],a:2,
 e:'수선사 결사를 이끈 보조국사는 지눌이에요. 지눌은 돈오점수를 주장했어요. 해동 천태종은 의천, 현량과는 조광조, 무애가는 원효, 왕오천축국전은 혜초예요.'},
{lv:1,tag:'문화',src:'고1 2021-11 11번 변형',p:'전북 부안에 세워진 박물관은 이 왕조의 청자 제작 지역 중 하나이다. 청자는 팔만대장경판, 직지심체요절과 함께 이 왕조의 대표적인 문화유산이다.',q:'이 왕조의 문화에 대한 설명으로 옳은 것은?',o:['동의보감이 편찬되었다.','삼국사기가 편찬되었다.','경국대전이 반포되었다.','고사촬요가 간행되었다.','농사직설이 편찬되었다.'],a:1,
 e:'청자와 팔만대장경, 직지심체요절은 고려의 유산이에요. 고려 인종 때 삼국사기가 편찬되었어요. 나머지 책은 모두 조선 시대에 만들어졌어요.'},
{lv:1,tag:'문화',src:'고1 2016-11 10번 변형',p:'이 왕조의 대표적인 기록 유산으로 우리나라에 현존하는 가장 오래된 역사서이다. 김부식이 유교적 합리주의 사관에 따라 기전체로 서술하였다.',q:'이 왕조의 문화에 대한 설명으로 옳은 것은?',o:['대동여지도가 제작되었다.','청자에 상감 기법이 도입되었다.','백자가 널리 쓰였다.','분청사기가 만들어졌다.','판소리가 유행하였다.'],a:1,
 e:'삼국사기를 편찬한 나라는 고려예요. 고려에서는 청자에 상감 기법이 도입됐어요. 대동여지도·백자·분청사기·판소리는 조선 시대의 문화예요.'},
{lv:1,tag:'문화',src:'고1 2019-11 6번 · 고3 2027-06 4번 변형',p:'개성 만월대 발굴 유물전: 만월대는 이 나라의 궁궐터로 남북의 학자가 공동으로 발굴하였다.',q:'이 나라의 문화에 대한 설명으로 옳은 것은?',o:['첨성대를 건립하였다.','팔만대장경을 조판하였다.','석굴암을 조성하였다.','경복궁을 세웠다.','수원 화성을 건설하였다.'],a:1,
 e:'개성 만월대는 고려의 궁궐터예요. 고려는 팔만대장경을 조판했어요. 첨성대와 석굴암은 신라, 경복궁과 수원 화성은 조선의 건축물이에요.'},
/* ---- 심화 (6) ---- */
{lv:2,tag:'무신 정권',src:'고1 2017-11 13번 변형',p:'(가) 정중부 등이 무신 정변을 일으켰다(1170).\n(나) 몽골이 고려에 침입하였다(1231).',q:'(가)와 (나) 사이에 있었던 일로 옳은 것은?',o:['최충헌이 이의민을 제거하고 집권하였다.','묘청이 서경 천도 운동을 일으켰다.','이자겸이 난을 일으켰다.','서희가 강동 6주를 확보하였다.','이성계가 위화도에서 회군하였다.'],a:0,
 e:'1170년과 1231년 사이인 1196년에 최충헌이 이의민을 제거하고 집권했어요. 묘청의 난과 이자겸의 난은 그 이전, 위화도 회군은 이후의 일이에요.'},
{lv:2,tag:'공민왕',src:'고2 2020-11 6번 변형',q:'공민왕의 개혁으로 옳은 것만을 <보기>에서 고른 것은?\n\nㄱ. 정동행성 이문소를 폐지하였다.\nㄴ. 신돈을 등용해 전민변정도감을 설치하였다.\nㄷ. 윤관의 건의로 별무반을 조직하였다.\nㄹ. 노비안검법을 실시하였다.',o:['ㄷ, ㄹ','ㄱ, ㄷ','ㄴ, ㄷ','ㄴ, ㄹ','ㄱ, ㄴ'],a:4,
 e:'이문소 폐지(ㄱ)와 전민변정도감 설치(ㄴ)는 공민왕의 정책이에요. 별무반(ㄷ)은 윤관, 노비안검법(ㄹ)은 광종 때의 일이에요.'},
{lv:2,tag:'연표',src:'고1 2017-11 13번 · 고3 2025-09 종합',q:'다음 사건을 오래된 순서대로 나열한 것은?\n(가) 위화도 회군\n(나) 몽골의 침입 시작\n(다) 무신 정변\n(라) 공민왕의 쌍성총관부 수복',o:['(가) – (나) – (다) – (라)','(나) – (다) – (라) – (가)','(다) – (가) – (나) – (라)','(다) – (나) – (라) – (가)','(다) – (나) – (가) – (라)'],a:3,
 e:'무신 정변(1170) → 몽골 침입(1231) → 쌍성총관부 수복(1356) → 위화도 회군(1388) 순서예요. 다·나·라·가로 외워 두세요.'},
{lv:2,tag:'원 간섭기',src:'고3 2026-06 4번 · 고2 2015-11 7번 종합',q:'원 간섭기의 모습으로 옳지 않은 것은?',o:['충렬왕 때 정동행성이 설치되었다.','고려 왕실의 호칭과 관제가 격하되었다.','몽골풍이 유행하고 공녀가 끌려갔다.','쌍성총관부 등 원의 직할지가 고려 땅에 있었다.','최충헌이 교정도감을 두어 권력을 행사하였다.'],a:4,
 e:'교정도감은 최충헌이 무신 집권기(13세기 초)에 설치한 기구라서 원 간섭기의 모습이 아니에요. 나머지는 모두 원 간섭기의 모습이에요.'},
{lv:2,tag:'문화',src:'고3 2025-06 4번 · 고2 2026-10 3번 종합',q:'문화유산과 그것이 만들어진 시기의 연결로 옳은 것은?',o:['삼국사기 – 원 간섭기에 편찬','삼국유사 – 인종 때 편찬','팔만대장경 – 몽골 침입기에 제작','직지심체요절 – 광종 때 간행','경천사지 10층 석탑 – 태조 때 건립'],a:2,
 e:'팔만대장경은 몽골 침입기(13세기)에 제작됐어요. 삼국사기는 인종(12세기), 삼국유사는 충렬왕 때(원 간섭기), 직지심체요절은 우왕(14세기 후반), 경천사지 10층 석탑은 충목왕(14세기 중반) 때예요.'},
{lv:2,tag:'불교',src:'고3 2020-09 6번 · 고1 2020-11 3번 종합',q:'고려 승려와 그에 관한 설명으로 옳은 것만을 <보기>에서 고른 것은?\n\nㄱ. 의천 – 교관겸수를 내세워 해동 천태종을 열었다.\nㄴ. 지눌 – 수선사 결사를 제창하고 정혜쌍수를 강조하였다.\nㄷ. 원효 – 화쟁 사상을 주장하였다.\nㄹ. 의상 – 화엄 사상을 전하였다.',o:['ㄷ, ㄹ','ㄱ, ㄷ','ㄴ, ㄷ','ㄱ, ㄴ','ㄴ, ㄹ'],a:3,
 e:'의천(ㄱ)과 지눌(ㄴ)이 고려의 승려예요. 원효(ㄷ)와 의상(ㄹ)은 신라 승려예요.'}
];

(function(){var s=20261106;function r(){s=(s*1664525+1013904223)%4294967296;return s/4294967296}var idx=[];Q.forEach(function(q,i){if(!/^[ㄱ-ㅎ(]/.test(q.o[0])&&!/[①-⑤]/.test(q.e))idx.push(i)});var perm=[];idx.forEach(function(i,k){if(k%5===0){perm=[0,1,2,3,4];for(var j=4;j>0;j--){var x=Math.floor(r()*(j+1)),t=perm[j];perm[j]=perm[x];perm[x]=t}}var tg=perm[k%5],q=Q[i],cor=q.o[q.a],rest=q.o.filter(function(_,j){return j!==q.a});for(var j=rest.length-1;j>0;j--){var x=Math.floor(r()*(j+1)),t=rest[j];rest[j]=rest[x];rest[x]=t}rest.splice(tg,0,cor);q.o=rest;q.a=tg})})();

/* ===================== exam controller ===================== */
var quiz=document.getElementById('view-quiz'),st={ans:[],graded:false,locked:{},t0:0,tm:null};
function resetState(){st.ans=Q.map(function(){return null});st.graded=false;st.locked={};st.t0=Date.now();}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function buildQuiz(){resetState();
  var h='<div class="bar-sticky" id="bar"><b id="cnt">0 / '+Q.length+'</b><div class="prog"><i id="pg"></i></div><b id="tm">00:00</b></div>'+
  '<div id="res"></div>'+
  '<div class="box intro"><h3>시험 안내</h3><p>36문제 · 쉬운 문제부터 어려운 문제 순서 · 문제마다 보기 5개 중 하나 선택</p><p>마지막 문제까지 모두 고르면 <b>자동으로 채점</b>돼요. 채점 뒤에는 문제마다 해설이 열려요.</p></div>';
  var n=0;
  LV.forEach(function(L,li){var items=Q.map(function(q,i){return [q,i]}).filter(function(x){return x[0].lv===li});
    h+='<h2 class="lv">'+L.s+' '+L.n+'<small>'+items.length+'문항 · '+L.d+'</small></h2>';
    items.forEach(function(x){var q=x[0],i=x[1];n++;
      h+='<article class="q" id="q'+i+'"><div class="qh"><span class="qn">'+(i+1)+'</span><span class="tag">'+q.tag+'</span><span class="mark" id="m'+i+'"></span></div>'+
      (q.p?'<div class="pass">'+esc(q.p)+'</div>':'')+'<div class="qt">'+esc(q.q)+'</div><div class="opts">'+
      q.o.map(function(o,j){return '<div><input type="radio" name="r'+i+'" id="r'+i+'_'+j+'" value="'+j+'"><label for="r'+i+'_'+j+'"><span class="no">'+(j+1)+'</span><span>'+esc(o)+'</span></label></div>'}).join('')+
      '</div><div class="exp" id="e'+i+'" hidden></div></article>';});});
  h+='<div class="acts"><button class="btn" id="force">지금 채점하기</button></div>';
  quiz.innerHTML=h;
  quiz.querySelectorAll('input[type=radio]').forEach(function(r){r.addEventListener('change',function(){
    var i=+r.name.slice(1);st.ans[i]=+r.value;update();
    if(!st.graded&&st.ans.every(function(a){return a!==null})){grade(true)}});});
  document.getElementById('force').onclick=function(){grade(false)};
  clearInterval(st.tm);st.tm=setInterval(tick,1000);update();}
function tick(){if(st.graded)return;var s=Math.floor((Date.now()-st.t0)/1000);var el=document.getElementById('tm');if(el)el.textContent=('0'+Math.floor(s/60)).slice(-2)+':'+('0'+s%60).slice(-2)}
function update(){var c=st.ans.filter(function(a){return a!==null}).length;document.getElementById('cnt').textContent=c+' / '+Q.length;document.getElementById('pg').style.width=(c/Q.length*100)+'%'}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true},3200)}
function grade(auto){
  var un=st.ans.filter(function(a){return a===null}).length;
  if(!auto&&un>0){toast('아직 '+un+'문제를 풀지 않았어요. 모두 풀면 자동으로 채점돼요.');return}
  st.graded=true;clearInterval(st.tm);
  var ok=0,byLv=[0,0,0],totLv=[0,0,0],byTag={},totTag={},wrong=[];
  Q.forEach(function(q,i){var a=st.ans[i],good=a===q.a;totLv[q.lv]++;totTag[q.tag]=(totTag[q.tag]||0)+1;
    if(good){ok++;byLv[q.lv]++;byTag[q.tag]=(byTag[q.tag]||0)+1}else wrong.push(i);
    var card=document.getElementById('q'+i);card.classList.remove('ok','ng');card.classList.add('lock',good?'ok':'ng');
    document.getElementById('m'+i).textContent=good?'정답':'오답';
    card.querySelectorAll('input').forEach(function(r){r.disabled=true});
    q.o.forEach(function(_,j){var lb=card.querySelector('label[for=r'+i+'_'+j+']');lb.classList.remove('right','wrong');if(j===q.a)lb.classList.add('right');else if(j===a)lb.classList.add('wrong')});
    var e=document.getElementById('e'+i);e.hidden=false;
    e.innerHTML='<b>정답 '+(q.a+1)+'번</b>'+(good?'':' · 내가 고른 답 '+(a===null?'없음':(a+1)+'번'))+'<br>'+esc(q.e)+'<div class="from">근거 기출: '+q.src+' (변형 문제)</div>';});
  var pct=Math.round(ok/Q.length*100),deg=Math.round(ok/Q.length*360);
  var rows=LV.map(function(L,li){return rowH(L.s+' '+L.n,byLv[li],totLv[li])}).concat(Object.keys(totTag).map(function(t){return rowH(t,byTag[t]||0,totTag[t])})).join('');
  var weak=Object.keys(totTag).filter(function(t){return (byTag[t]||0)<totTag[t]}).sort(function(a,b){return ((byTag[a]||0)/totTag[a])-((byTag[b]||0)/totTag[b])});
  var msg=ok===Q.length?'만점이에요. 고려 ②(무신 정권~멸망) 단원은 완벽해요.':ok>=Q.length*0.8?'아주 잘했어요. 틀린 문제의 해설만 한 번 더 읽어 보세요.':ok>=Q.length*0.6?'기본기는 있어요. 약한 시대를 만화 수업에서 다시 확인해 보세요.':'만화 수업을 한 번 더 읽고 다시 도전해 보세요. 유물 짝꿍부터 다시 잡아요.';
  var secs=Math.floor((Date.now()-st.t0)/1000);
  document.getElementById('res').innerHTML='<section class="result" id="resBox"><h2>채점 결과</h2><div class="score"><div class="ring" style="background:conic-gradient(var(--ok) '+deg+'deg,var(--bg) 0)"><div>'+ok+' / '+Q.length+'<small>'+pct+'점</small></div></div><div class="rows">'+rows+'</div></div>'+
  '<p class="msg">'+msg+(weak.length?' 보강할 부분: <b>'+weak.slice(0,3).join(', ')+'</b>.':'')+' 걸린 시간 '+Math.floor(secs/60)+'분 '+secs%60+'초.</p>'+
  '<div class="acts">'+(wrong.length?'<button class="btn main" id="retryW">틀린 문제만 다시 풀기 ('+wrong.length+')</button>':'')+'<button class="btn" id="retryA">처음부터 다시 풀기</button><button class="btn" id="toStory">만화 수업 다시 보기</button></div></section>';
  document.getElementById('retryA').onclick=function(){buildQuiz();window.scrollTo({top:0})};
  document.getElementById('toStory').onclick=function(){show('story')};
  var rw=document.getElementById('retryW');if(rw)rw.onclick=function(){retryWrong(wrong)};
  if(auto)toast('36문항을 모두 풀어서 자동으로 채점했어요.');
  document.getElementById('resBox').scrollIntoView({behavior:'smooth',block:'start'});}
function rowH(n,a,t){return '<div class="row"><span>'+n+'</span><span class="t"><i style="width:'+Math.round(a/t*100)+'%"></i></span><span>'+a+'/'+t+'</span></div>'}
function retryWrong(wrong){
  st.graded=false;document.getElementById('res').innerHTML='';
  wrong.forEach(function(i){st.ans[i]=null;var card=document.getElementById('q'+i);card.classList.remove('ok','ng','lock');document.getElementById('m'+i).textContent='';document.getElementById('e'+i).hidden=true;
    card.querySelectorAll('input').forEach(function(r){r.disabled=false;r.checked=false});card.querySelectorAll('label').forEach(function(l){l.classList.remove('right','wrong')});});
  st.t0=Date.now();clearInterval(st.tm);st.tm=setInterval(tick,1000);update();
  var f=document.getElementById('q'+wrong[0]);f.scrollIntoView({behavior:'smooth',block:'center'});toast('틀린 문제 '+wrong.length+'개만 열었어요. 다 풀면 다시 채점돼요.');}

/* ===================== tabs / routing ===================== */
var built=false;
function show(v){var q=v==='quiz';
  document.getElementById('view-story').hidden=q;document.getElementById('view-quiz').hidden=!q;
  document.getElementById('tab-story').setAttribute('aria-selected',String(!q));document.getElementById('tab-quiz').setAttribute('aria-selected',String(q));
  if(q&&!built){buildQuiz();built=true}
  try{history.replaceState(null,'','#'+v)}catch(e){location.hash=v}
  window.scrollTo({top:0});}
document.getElementById('tab-story').onclick=function(){show('story')};
document.getElementById('tab-quiz').onclick=function(){show('quiz')};
window.addEventListener('hashchange',function(){show(location.hash==='#quiz'?'quiz':'story')});
renderStory();if(location.hash==='#quiz')show('quiz');
</script>
<!-- BESTIAN-PATCH -->
<style>

<script>
/* ===================== 베스티안: 결과 보내기 + 틀린 문제만 다시 풀기 ===================== */
(function(){
  var UNIT={"no": 5, "name": "고려 ②"};
  var KEY='bestian-student-name';
  function getName(){try{return localStorage.getItem(KEY)||''}catch(e){return ''}}
  function setName(v){try{localStorage.setItem(KEY,v)}catch(e){}}
  function clean(v){return String(v||'').replace(/[·\[\]\n\r\t]/g,' ').replace(/\s+/g,' ').trim().slice(0,20)}
  function two(n){return ('0'+n).slice(-2)}
  function when(d){return (d.getMonth()+1)+'/'+d.getDate()+' '+two(d.getHours())+':'+two(d.getMinutes())}
  var rs={first:null,mode:false,retried:[]};
  var _build=buildQuiz,_grade=grade,_retry=retryWrong;

  function showAll(){
    quiz.querySelectorAll('article.q,h2.lv,.box.intro').forEach(function(el){el.hidden=false});
    var b=document.getElementById('rwBanner');if(b)b.remove();
  }

  buildQuiz=function(){rs.first=null;rs.mode=false;rs.retried=[];_build();};

  function codeLine(){
    var f=rs.first,name=clean(document.getElementById('stuName')?document.getElementById('stuName').value:getName());
    var wrongTxt=f.wrong.length?'오답 '+f.wrong.map(function(i){return i+1}).join(','):'오답 없음';
    var fixed=f.wrong.filter(function(i){return st.ans[i]===Q[i].a}).length;
    return '[베스티안 한국사] '+(name||'이름')+' · '+UNIT.no+'단원 '+UNIT.name+' · '+f.ok+'/'+Q.length+' · '+wrongTxt+' · 오답 해결 '+fixed+'/'+f.wrong.length+' · '+when(f.at);
  }
  function copyText(t,done,fail){
    function fb(){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);ok?done():fail()}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,fb)}else fb();
  }

  grade=function(auto){
    var wasMode=rs.mode;
    _grade(auto);
    if(!st.graded)return;
    var wrongNow=[];Q.forEach(function(q,i){if(st.ans[i]!==q.a)wrongNow.push(i)});
    if(!rs.first)rs.first={ok:Q.length-wrongNow.length,wrong:wrongNow.slice(),at:new Date()};try{var _k='bestian-hist-'+UNIT.no;if(!localStorage.getItem(_k))localStorage.setItem(_k,JSON.stringify({ok:rs.first.ok,total:Q.length,at:rs.first.at.toISOString()}))}catch(e){}
    var box=document.getElementById('resBox');if(!box)return;
    var f=rs.first,fixed=f.wrong.filter(function(i){return st.ans[i]===Q[i].a}).length;
    if(wasMode){
      var got=rs.retried.filter(function(i){return st.ans[i]===Q[i].a}).length;
      box.querySelector('h2').textContent='틀린 문제 다시 풀기 채점';
      var p=document.createElement('p');p.className='rw-note';
      p.textContent='다시 푼 '+rs.retried.length+'문제 중 '+got+'문제 정답! 처음 틀린 '+f.wrong.length+'문제 중 '+fixed+'문제를 해결했어요.'+(fixed<f.wrong.length?' 남은 '+(f.wrong.length-fixed)+'문제도 다시 도전해 보세요.':' 오답을 모두 해결했어요.');
      box.insertBefore(p,box.querySelector('.acts'));
      toast('다시 푼 문제를 채점했어요.');
    }
    var s=document.createElement('div');s.className='send';s.id='sendBox';
    s.innerHTML='<h3>결과 보내기</h3><p class="src" style="margin:0">점수는 <b>처음 푼 결과('+f.ok+'/'+Q.length+')</b>로 기록되고, 틀린 문제를 다시 풀면 “오답 해결” 수가 올라가요.</p>'+
      '<label for="stuName">이름</label><input id="stuName" type="text" maxlength="20" autocomplete="name" placeholder="이름을 입력하세요">'+
      '<div class="code" id="codeLine"></div>'+
      '<div class="row2"><button class="btn main" id="copyCode">결과 복사</button><span class="src">복사한 결과를 담당 선생님 카톡에 붙여넣어 주세요.</span></div>';
    box.appendChild(s);
    var inp=document.getElementById('stuName');inp.value=getName();
    function refresh(){document.getElementById('codeLine').textContent=codeLine()}
    inp.addEventListener('input',function(){setName(clean(inp.value));refresh()});
    refresh();
    document.getElementById('copyCode').onclick=function(){
      if(!clean(inp.value)){toast('이름을 먼저 입력해 주세요.');inp.focus();return}
      var t=codeLine();
      copyText(t,function(){toast('결과를 복사했어요. 선생님 카톡에 붙여넣어 주세요.')},function(){
        var el=document.getElementById('codeLine'),r=document.createRange();r.selectNodeContents(el);var sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);
        toast('자동 복사가 막혀 있어요. 선택된 글자를 길게 눌러 복사해 주세요.')});
    };
  };

  retryWrong=function(wrong){
    rs.mode=true;rs.retried=wrong.slice();
    var set={};wrong.forEach(function(i){set[i]=1});
    quiz.querySelectorAll('article.q').forEach(function(c){c.hidden=!set[+c.id.slice(1)]});
    quiz.querySelectorAll('h2.lv').forEach(function(h){var n=h.nextElementSibling,any=false;
      while(n&&n.tagName!=='H2'){if(n.matches&&n.matches('article.q')&&!n.hidden)any=true;n=n.nextElementSibling}h.hidden=!any});
    var intro=quiz.querySelector('.box.intro');if(intro)intro.hidden=true;
    var old=document.getElementById('rwBanner');if(old)old.remove();
    var b=document.createElement('div');b.className='box rw-banner';b.id='rwBanner';
    b.innerHTML='<h3>틀린 문제만 다시 풀기 · '+wrong.length+'문제</h3><p>틀렸던 문제만 모았어요. 다 고르면 자동으로 채점되고 해설이 다시 열려요.</p><p class="src">처음 점수 '+(rs.first?rs.first.ok:'-')+'/'+Q.length+'은 그대로 기록돼요.</p><div class="acts" style="margin-top:8px"><button class="btn" id="rwAll">전체 문제 함께 보기</button></div>';
    var res=document.getElementById('res');res.parentNode.insertBefore(b,res.nextSibling);
    _retry(wrong);
    document.getElementById('rwAll').onclick=function(){showAll();rs.mode=true;toast('전체 문제를 다시 보여 줘요. 다시 풀 문제만 선택할 수 있어요.')};
  };
})();
</script>

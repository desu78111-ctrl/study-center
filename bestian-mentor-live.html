<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0072b5">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="logo.png">
<title>베스티안 멘토 · 내 학생 실시간</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:#f1f4f7;border:1px solid var(--line);font-size:13.5px;font-weight:700;margin:2px 4px 2px 0}.chip.in{background:#e3f1ea;color:var(--green)}.chip.out{background:#fff3dd;color:var(--amber)}.chip.done{background:#eceff2;color:var(--mute)}.chip.none{background:#fbe3e6;color:var(--red)}

:root{--bg:#f5f7f9;--line:#d8dfe5;--ink:#1d2328;--mute:#6b737a;--blue:#0072b5;--blued:#004f80;--yellow:#f2c100;--green:#1f7a4d;--amber:#9a5b00;--red:#b02a37}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit}
.top{background:var(--blue);color:#fff;border-bottom:6px solid var(--yellow)}.top .in{max-width:1080px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:clamp(18px,4vw,27px);margin:0;font-weight:900;color:#fff;white-space:nowrap}.top h1 small{display:block;font-size:11.5px;letter-spacing:.14em;color:#ffe680;font-weight:700}.top img{height:38px;background:#fff;border-radius:6px;padding:5px 8px}
main{max-width:1080px;margin:0 auto;padding:18px 16px;display:grid;gap:16px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:16px}@media(max-width:820px){.g2{grid-template-columns:minmax(0,1fr)}}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}.panel h3{margin:0 0 8px;font-size:16px;font-weight:900;color:var(--blued)}
.inp,.ta,.sel{width:100%;font-size:16px;padding:10px 11px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.btn{display:inline-block;background:var(--blue);color:#fff;font-weight:900;padding:10px 14px;border-radius:8px;border:0;cursor:pointer;min-height:40px}.btn.g{background:#eef5fa;color:var(--ink)}
.hint{font-size:13px;color:var(--mute);margin:0}
.kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}@media(max-width:600px){.kpi{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}.kpi small{display:block;color:var(--mute);font-size:12px}.kpi b{font-size:22px}
table{width:100%;border-collapse:collapse;font-size:14px}th{background:var(--blued);color:#fff;padding:8px;font-weight:700}td{padding:8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}td:first-child{text-align:left;font-weight:700;color:var(--blued)}
.in{color:var(--green);font-weight:900}.out{color:var(--amber);font-weight:900}.done{color:var(--mute);font-weight:900}.none{color:var(--red);font-weight:900}
.upd{font-size:12.5px;color:var(--mute)}
</style>
</head>
<body>
<div class="top"><div class="in"><h1><small>BESTIAN MENTOR</small>내 학생 실시간 현황</h1><img src="logo.png" alt="BESTIAN"></div></div>
<main>
  <div class="kpi" id="allKpi" style="grid-template-columns:repeat(3,minmax(0,1fr))"></div>
  <div class="panel" style="display:grid;gap:8px">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input class="inp" id="q" placeholder="학생 이름 검색 (내 학생이 아니어도 찾을 수 있어요)" autocomplete="off" style="flex:1;min-width:200px"><button class="btn" type="button" id="qBtn">찾기</button></div>
    <div id="qOut" class="hint"></div>
  </div>
  <div class="g2">
    <div class="panel" style="display:grid;gap:10px;align-content:start">
      <h3 style="margin:0">내 학생 명단</h3>
      <p class="hint">첫 줄에 멘토 이름, 다음 줄부터 학생 이름을 한 줄에 한 명씩. (멘토 센터 → 스터디센터 라이브 → <b>내 학생 명단 복사</b>를 그대로 붙여넣기) 이 기기에 저장돼요.</p>
      <textarea class="ta" id="paste" rows="8" placeholder="김선배&#10;김베스&#10;이티안"></textarea>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="button" id="save">명단 저장</button><button class="btn g" type="button" id="refresh">새로고침</button></div>
      <p class="hint" id="msg"></p>
    </div>
    <div class="panel" style="display:grid;gap:12px;align-content:start">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap"><h3 style="margin:0" id="ttl">현황</h3><span class="upd" id="upd"></span></div>
      <div class="kpi" id="kpi"></div>
      <div style="overflow-x:auto"><table id="tbl"></table></div>
      <p class="hint"><a href="bestian-live-seats.html" style="color:var(--blue);font-weight:700">좌석도(번호만) 보기</a> · 재실 = 키오스크 입실 후 공부 중 · 외출 = 외출 처리됨 · 하원 = 하원 처리됨 · 미입실 = 오늘 입실 기록 없음. 15초마다, 그리고 출결이 바뀔 때 바로 갱신돼요.</p>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
"use strict";
var SUPABASE_URL='https://qtpftloyumtffvgurvqv.supabase.co',SUPABASE_KEY='sb_publishable_XGP9n-2fuBQFuJlAA5MJ8w_R8JYIi9O';
var MOCK=/[?&]mock=1/.test(location.search),db=null;try{if(!MOCK&&window.supabase)db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY)}catch(e){}
var $=function(s){return document.querySelector(s)},pad=function(n){return n<10?'0'+n:''+n};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
function fmtD(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function bizToday(){var d=new Date();if(d.getHours()<1||(d.getHours()===1&&d.getMinutes()<10))d.setDate(d.getDate()-1);return fmtD(d)}
function tMin(t){if(!t)return null;var m=String(t).match(/^(\d{1,2}):(\d{2})/);return m?(+m[1])*60+(+m[2]):null}
function nowMin(){var d=new Date();var m=d.getHours()*60+d.getMinutes();if(bizToday()!==fmtD(d))m+=1440;return m}
function outs(r){var o=[];[['out_1_start','out_1_end'],['out_2_start','out_2_end']].forEach(function(p){if(r[p[0]])o.push({s:tMin(r[p[0]]),e:r[p[1]]?tMin(r[p[1]])+(r[p[1]+'_is_next_day']?1440:0):null})});if(r.pending_out_start)o.push({s:tMin(r.pending_out_start),e:null});return o}
function statusOf(r){if(!r||!r.check_in_time)return 'none';if(r.check_out_time)return 'done';return outs(r).some(function(o){return o.e==null})?'out':'in'}
function minutesOf(r){if(!r||!r.check_in_time)return 0;var ci=tMin(r.check_in_time),end=r.check_out_time?tMin(r.check_out_time)+(r.check_out_is_next_day?1440:0):nowMin();var m=end-ci;outs(r).forEach(function(o){if(o.s==null)return;var e=o.e==null?nowMin():o.e;m-=Math.max(0,Math.min(e,end)-o.s)});m-=Number(r.extra_out_minutes)||0;return Math.max(0,m)}
function fmtM(m){m=Math.max(0,Math.round(m));return m>=60?Math.floor(m/60)+'시간 '+pad(m%60)+'분':m+'분'}
var GATE_H='d8553e3ac2d808918a2ff3be6f092d23550436d4f051d0fccb41dc675a3bd83a';
function gateOk(){if(location.protocol==='file:')return Promise.resolve(true);
  var k=(location.search.match(/[?&]k=([^&#]+)/)||[])[1]||'';if(!k){try{k=localStorage.getItem('bestian_staff_k')||''}catch(e){}}
  if(!k||!(window.crypto&&crypto.subtle&&window.TextEncoder))return Promise.resolve(false);
  return crypto.subtle.digest('SHA-256',new TextEncoder().encode(k)).then(function(b){var hex=Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2)}).join('');
    if(hex!==GATE_H)return false;try{localStorage.setItem('bestian_staff_k',k)}catch(e){}return true}).catch(function(){return false})}
function lockPage(where){document.querySelector('main').innerHTML='<div class="panel" style="text-align:center;padding:36px 18px"><h3 style="font-size:20px">직원용 화면이에요</h3><p class="hint" style="font-size:14.5px">'+where+'의 <b>스터디센터 라이브</b> 탭에 있는 버튼으로 열어 주세요.<br>한 번 열면 이 기기에서는 다음부터 바로 열려요.</p></div>'}
var ALL=[];
async function loadAll(){try{if(MOCK){ALL=[{student_id:'u0',check_in_time:'09:05:00'},{student_id:'u1',check_in_time:'09:30:00',pending_out_start:'12:30:00'},{student_id:'z1',check_in_time:'09:00:00'},{student_id:'z2',check_in_time:'09:10:00',check_out_time:'15:00:00'}]}
  else{if(!db)return;var a=await db.from('reading_room_attendance').select('*').eq('attend_date',bizToday());if(a.error)return;ALL=a.data||[]}
  var c={in:0,out:0,done:0};ALL.forEach(function(r){var s=statusOf(r);if(c[s]!=null)c[s]++});
  $('#allKpi').innerHTML='<div><small>센터 전체 · 지금 공부 중</small><b class="in">'+c.in+'명</b></div><div><small>외출</small><b class="out">'+c.out+'명</b></div><div><small>오늘 하원</small><b class="done">'+c.done+'명</b></div>'}catch(e){}}
async function search(){var q=$('#q').value.trim();if(!q){$('#qOut').textContent='';return}
  try{var users=[],att=[],seats=[];
    if(MOCK){users=(LIST?LIST.students:['김베스','이티안']).filter(function(n){return n.indexOf(q)>-1}).map(function(n,i){return {id:'u'+i,name:n,grade:'고2'}});att=[{student_id:'u0',attend_date:bizToday(),check_in_time:'09:05:00'}];seats=[{seat_no:16,student_id:'u0'}]}
    else{if(!db)throw 0;var u=await db.from('users').select('id,name,grade,status,deleted_at,reading_room_withdrawn_at').eq('reading_room_yn',true).ilike('name','%'+q+'%').limit(30);if(u.error)throw u.error;users=(u.data||[]).filter(function(x){return x.status!=='inactive'&&!x.deleted_at&&!x.reading_room_withdrawn_at});
      var ids=users.map(function(x){return x.id});if(ids.length){var a=await db.from('reading_room_attendance').select('*').eq('attend_date',bizToday()).in('student_id',ids);att=a.error?[]:(a.data||[]);var s=await db.from('reading_room_seats').select('seat_no,student_id').in('student_id',ids);seats=s.error?[]:(s.data||[])}}
    if(!users.length){$('#qOut').innerHTML='"'+esc(q)+'" 학생을 독서실 명단에서 찾지 못했어요.';return}
    var byId={};att.forEach(function(r){byId[r.student_id]=r});var seatBy={};seats.forEach(function(s){seatBy[s.student_id]=s.seat_no});
    var lab={in:'재실',out:'외출',done:'하원',none:'미입실'};
    $('#qOut').innerHTML=users.map(function(x){var r=byId[x.id],st=statusOf(r);var mine=LIST&&LIST.students.indexOf(x.name)>-1;return '<span class="chip '+st+'">'+esc(x.name)+(x.grade?' <small>'+esc(x.grade)+'</small>':'')+' · '+lab[st]+(seatBy[x.id]?' · '+seatBy[x.id]+'번':'')+(r&&r.check_in_time?' · '+String(r.check_in_time).slice(0,5)+' 입실':'')+(r?' · 순공 '+fmtM(minutesOf(r)):'')+(mine?' · 내 학생':'')+'</span>'}).join('')}
  catch(e){$('#qOut').textContent='검색하지 못했어요. 잠시 후 다시 시도해요.'}}
$('#qBtn').onclick=search;$('#q').addEventListener('keydown',function(e){if(e.key==='Enter')search()});
var LIST=null;try{LIST=JSON.parse(localStorage.getItem('bm_list')||'null')}catch(e){}
if(LIST)$('#paste').value=[LIST.mentor].concat(LIST.students).join('\n');
$('#save').onclick=function(){var lines=$('#paste').value.split(/\r?\n/).map(function(l){return l.replace(/^[\-\d\.\)\s]+/,'').trim()}).filter(Boolean);if(lines.length<2){$('#msg').textContent='첫 줄에 멘토 이름, 다음 줄부터 학생 이름을 적어 주세요.';return}
  LIST={mentor:lines[0],students:lines.slice(1)};try{localStorage.setItem('bm_list',JSON.stringify(LIST))}catch(e){}$('#msg').textContent=LIST.mentor+' 명단 저장 ('+LIST.students.length+'명)';load()};
$('#refresh').onclick=load;
var chan=null;
async function load(){if(!LIST){$('#tbl').innerHTML='<tr><td style="color:var(--mute);font-weight:500">명단을 먼저 저장하세요.</td></tr>';$('#kpi').innerHTML='';return}
  $('#ttl').textContent=LIST.mentor+' 멘토 · 내 학생 '+LIST.students.length+'명';
  var users=[],att=[],seats=[];
  try{
    if(MOCK){users=LIST.students.map(function(n,i){return {id:'u'+i,name:n}});att=[{student_id:'u0',attend_date:bizToday(),check_in_time:'09:05:00'},{student_id:'u1',attend_date:bizToday(),check_in_time:'09:30:00',pending_out_start:'12:30:00',pending_out_reason:'점심'}];seats=[{seat_no:16,student_id:'u0'},{seat_no:21,student_id:'u1'}]}
    else{if(!db)throw new Error('no db');
      var u=await db.from('users').select('id,name,status,deleted_at,reading_room_withdrawn_at').in('name',LIST.students).eq('reading_room_yn',true);if(u.error)throw u.error;users=(u.data||[]).filter(function(x){return x.status!=='inactive'&&!x.deleted_at&&!x.reading_room_withdrawn_at});
      var ids=users.map(function(x){return x.id});
      if(ids.length){var a=await db.from('reading_room_attendance').select('*').eq('attend_date',bizToday()).in('student_id',ids);if(a.error)throw a.error;att=a.data||[];var s=await db.from('reading_room_seats').select('seat_no,student_id').in('student_id',ids);if(!s.error)seats=s.data||[]}}
  }catch(e){$('#msg').textContent='출결 서버에 연결하지 못했어요. 잠시 후 다시 시도해요.';return}
  var byId={};att.forEach(function(r){byId[r.student_id]=r});var seatBy={};seats.forEach(function(s){seatBy[s.student_id]=s.seat_no});
  var rows=[];LIST.students.forEach(function(n){var us=users.filter(function(u){return u.name===n});if(!us.length)us=[null];us.forEach(function(u){var r=u?byId[u.id]:null;rows.push({n:n+(us.length>1?' (동명이인)':''),known:!!u,seat:u?seatBy[u.id]:null,st:u?statusOf(r):'unknown',r:r,min:r?minutesOf(r):0})})});
  var c={in:0,out:0,done:0,none:0};rows.forEach(function(x){if(c[x.st]!=null)c[x.st]++});
  $('#kpi').innerHTML='<div><small>재실</small><b class="in">'+c.in+'명</b></div><div><small>외출</small><b class="out">'+c.out+'명</b></div><div><small>하원</small><b class="done">'+c.done+'명</b></div><div><small>미입실</small><b class="none">'+c.none+'명</b></div>';
  var ord={in:0,out:1,none:2,done:3,unknown:4};rows.sort(function(a,b){return ord[a.st]-ord[b.st]||a.n.localeCompare(b.n,'ko')});
  var lab={in:'<span class="in">재실</span>',out:'<span class="out">외출</span>',done:'<span class="done">하원</span>',none:'<span class="none">미입실</span>',unknown:'<span class="done">명단에 없음</span>'};
  $('#tbl').innerHTML='<thead><tr><th>학생</th><th>자리</th><th>상태</th><th>입실</th><th>오늘 순공</th><th>비고</th></tr></thead><tbody>'+rows.map(function(x){var r=x.r||{};var note=x.st==='out'?(r.pending_out_reason||r.out_1_reason||r.out_2_reason||'')+(r.pending_out_expected_end?' · '+String(r.pending_out_expected_end).slice(0,5)+' 복귀 예정':''):x.st==='done'?'하원 '+String(r.check_out_time||'').slice(0,5):x.st==='unknown'?'독서실 등록 이름과 다름':'';
    return '<tr><td>'+esc(x.n)+'</td><td>'+(x.seat?x.seat+'번':'-')+'</td><td>'+lab[x.st]+'</td><td>'+(r.check_in_time?String(r.check_in_time).slice(0,5):'-')+'</td><td>'+(x.r?fmtM(x.min):'-')+'</td><td style="white-space:normal;color:var(--mute)">'+esc(note)+'</td></tr>'}).join('')+'</tbody>';
  var d=new Date();$('#upd').textContent='갱신 '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
  if(db&&!chan){try{chan=db.channel('bm-live').on('postgres_changes',{event:'*',schema:'public',table:'reading_room_attendance'},function(){load();loadAll();if($('#q').value.trim())search()}).subscribe()}catch(e){}}}
gateOk().then(function(ok){if(!ok){lockPage('멘토 센터');return}load();loadAll();setInterval(function(){load();loadAll();if($('#q').value.trim())search()},15000)});
})();
</script>
</body>
</html>
